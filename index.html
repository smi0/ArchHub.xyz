<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArchHub</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #050505;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: rgba(255,255,255,0.04);
            filter: blur(100px);
            border-radius: 50%;
            animation: float 7s ease-in-out infinite;
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        .logo {
            font-size: 46px;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #888;
            font-size: 15px;
            margin-bottom: 32px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .button {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            min-width: 150px;
            padding: 13px 20px;
            border: 1px solid #333;
            border-radius: 10px;
            background: #111;
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            overflow: hidden;
            transition:
                transform 0.25s ease,
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease;
        }

        .button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -120%;
            width: 80%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255,255,255,0.15),
                transparent
            );
            transform: skewX(-20deg);
            transition: left 0.6s ease;
        }

        .button:hover {
            transform: translateY(-3px);
            border-color: #777;
            background: #181818;
            box-shadow: 0 10px 30px rgba(0,0,0,0.45);
        }

        .button:hover::before {
            left: 140%;
        }

        .discord {
            background: #fff;
            color: #050505;
            border-color: #fff;
        }

        .discord:hover {
            background: #e8e8e8;
            border-color: #fff;
        }

        .icon {
            width: 17px;
            height: 17px;
            display: inline-block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translate(-30px, -20px);
            }
            50% {
                transform: translate(30px, 20px);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">ArchHub</div>
        <div class="subtitle">Welcome to ArchHub</div>

        <div class="buttons">

            <!-- Replace YOUR_LOADER_LINK with your actual loader page/link -->
            <a class="button" href="YOUR_LOADER_LINK">
                Free Loader
            </a>

            <!-- ArchHub Discord -->
            <a
                class="button discord"
                href="https://discord.gg/ArchHubxyz"
                target="_blank"
                rel="noopener noreferrer"
            >
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19.54 0c1.1 0 2 .9 2 2v20c0 1.1-.9 2-2 2H4.46c-1.1 0-2-.9-2-2V2c0-1.1.9-2 2-2h15.08zM8.4 15.4c-.8 0-1.45.65-1.45 1.45S7.6 18.3 8.4 18.3s1.45-.65 1.45-1.45-.65-1.45-1.45-1.45zm7.2 0c-.8 0-1.45.65-1.45 1.45s.65 1.45 1.45 1.45 1.45-.65 1.45-1.45-.65-1.45-1.45-1.45z"/>
                </svg>
                Join Discord
            </a>

        </div>
    </div>

</body>
</html>
